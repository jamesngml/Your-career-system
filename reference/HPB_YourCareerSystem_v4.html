<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }

.container { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }

.tagline { font-size: 15px; color: #6B6B6B; font-style: italic; margin-bottom: 24px; }

/* SEARCH */
.search-wrap { position: relative; margin-bottom: 16px; }
.search-input { width: 100%; padding: 14px 18px 14px 50px; font-size: 16px; font-family: inherit; border: 2px solid #D9D9D9; border-radius: 12px; background: #FFFFFF; color: #1A1A1A; transition: border-color 0.15s; }

.search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #6B6B6B; font-size: 20px; pointer-events: none; }
.clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6B6B6B; font-size: 18px; cursor: pointer; padding: 6px 10px; display: none; }
.clear-btn.visible { display: block; }
.search-meta { font-size: 12px; color: #6B6B6B; margin-bottom: 20px; min-height: 18px; }

/* FILTER CHIPS */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.chip { padding: 8px 16px; border-radius: 999px; border: 1.5px solid #D9D9D9; background: #FFFFFF; color: #1B3A5C; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px; }
.chip:hover { border-color: #1B3A5C; }
.chip.active { background: #1B3A5C; color: #FFFFFF; border-color: #1B3A5C; }
.chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

/* SECTIONS */
.section { margin-bottom: 32px; }
.section.hidden { display: none; }
.section-header { padding: 14px 0 8px; border-top: 4px solid var(--section-color); margin-bottom: 14px; }
.section-title { font-size: 18px; font-weight: 700; color: #1B3A5C; margin-bottom: 4px; }
.section-desc { font-size: 12.5px; color: #6B6B6B; font-style: italic; line-height: 1.5; }

/* CARDS */
.card { background: #F8FAFC; border-left: 5px solid var(--section-color); border-radius: 0 10px 10px 0; padding: 16px 20px 18px; margin-bottom: 12px; transition: opacity 0.15s; }
.card.hidden { display: none; }
.situation {
  font-size: 18px;
  font-weight: 700;
  color: #1B3A5C;
  margin-bottom: 16px;
  padding: 4px 0 12px;
  border-bottom: 2px solid var(--section-color);
  line-height: 1.3;
  letter-spacing: 0.1px;
}
.situation::before {
  content: "“ ";
  color: var(--section-color);
  font-size: 28px;
  font-weight: 900;
  vertical-align: -8px;
  margin-right: 2px;
  line-height: 0;
}
.tool-block { padding: 10px 0 4px; }
.tool-block + .tool-block { border-top: 1px dashed #D9D9D9; margin-top: 8px; padding-top: 12px; }
.tool-name { font-size: 13.5px; font-weight: 700; color: #1B3A5C; margin-bottom: 6px; letter-spacing: 0.3px; }
.tool-name::before { content: "▸ "; color: #D4A437; font-weight: 700; }
.tool-desc { font-size: 12.5px; color: #2C2C2C; line-height: 1.6; margin-bottom: 10px; }
.cta { display: inline-block; padding: 8px 14px; background: #1B3A5C; color: #FFE599; font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; border-radius: 6px; text-decoration: none; transition: background 0.15s; cursor: default; }
.cta:hover { background: #0F2640; }
.cta .arrow { margin-left: 5px; font-size: 13px; }

/* HIGHLIGHT */
.hl { background: #FFE599; padding: 0 2px; border-radius: 3px; color: #1A1A1A; font-weight: inherit; }

/* NO RESULTS */
.no-results { padding: 32px 24px; background: #F8FAFC; border-radius: 10px; text-align: center; color: #6B6B6B; font-size: 14px; display: none; }
.no-results.visible { display: block; }
.no-results strong { color: #1A1A1A; }

footer.foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid #E2E8F0; font-size: 11px; color: #6B6B6B; text-align: center; }

@media (max-width: 600px) {

}

// === RENDER ===
function escape(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function tokenize(q) { return q.toLowerCase().trim().split(/\s+/).filter(w => w.length > 0); }
function expandToken(token) {
  const set = new Set([token]);
  const syns = SYNONYMS[token];
  if (syns) syns.forEach(s => set.add(s.toLowerCase()));
  return set;
}
function getHighlightTerms(q) {
  if (!q) return [];
  const terms = new Set();
  const ql = q.toLowerCase().trim();
  expandToken(ql).forEach(t => terms.add(t));
  const tokens = tokenize(ql);
  if (tokens.length > 1) {
    for (const token of tokens) expandToken(token).forEach(t => terms.add(t));
  }
  return Array.from(terms).filter(t => t.length >= 2);
}
function highlight(text, q) {
  if (!q) return escape(text);
  const terms = getHighlightTerms(q);
  if (terms.length === 0) return escape(text);
  terms.sort((a, b) => b.length - a.length);
  const pattern = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const escaped = escape(text);
  return escaped.replace(new RegExp(`(${pattern})`, 'gi'), '<span class="hl">$1</span>');
}
function matches(situation, q) {
  if (!q) return true;
  const ql = q.toLowerCase().trim();
  if (!ql) return true;

  // Build haystack from situation text + all linked tools
  let haystack = situation.text.toLowerCase();
  for (const tk of situation.tools) {
    const t = TOOLS[tk];
    haystack += " " + t.name.toLowerCase() + " " + t.desc.toLowerCase() + " m" + t.module + " module " + t.module + " " + t.page.toLowerCase();
  }

  // First — full query (and its direct synonyms) as a single phrase
  const fullSyns = expandToken(ql);
  for (const s of fullSyns) {
    if (haystack.includes(s)) return true;
  }

  // Multi-word — ALL tokens must have at least one synonym in the haystack
  const tokens = tokenize(ql);
  if (tokens.length <= 1) return false;
  for (const token of tokens) {
    const syns = expandToken(token);
    let found = false;
    for (const syn of syns) {
      if (haystack.includes(syn)) { found = true; break; }
    }
    if (!found) return false;
  }
  return true;
}
function render() {
  const root = document.getElementById('results');
  root.innerHTML = '';
  const q = state.query.trim();
  const sec = state.section;
  let total = 0;
  for (const [secId, secMeta] of Object.entries(SECTIONS)) {
    if (sec !== 'all' && sec !== secId) continue;
    const cards = SITUATIONS.filter(s => s.section == secId && matches(s, q));
    if (cards.length === 0) continue;
    total += cards.length;
    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';
    sectionEl.style.setProperty('--section-color', secMeta.color);
    sectionEl.innerHTML = `
      <div class="section-header" style="--section-color:${secMeta.color};">
        <div class="section-title">${secId}.  ${secMeta.title}</div>
        <div class="section-desc">${secMeta.desc}</div>
      </div>
    `;
    cards.forEach(c => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.style.setProperty('--section-color', secMeta.color);
      const toolBlocks = c.tools.map(tk => {
        const t = TOOLS[tk];
        return `
          <div class="tool-block">
            <div class="tool-name">${highlight(t.name, q)}</div>
            <div class="tool-desc">${highlight(t.desc, q)}</div>
            <span class="cta">Open in HPB Module ${t.module} · ${t.page} <span class="arrow">→</span></span>
          </div>
        `;
      }).join('');
      cardEl.innerHTML = `
        <div class="situation">${highlight(c.text, q)}</div>
        ${toolBlocks}
      `;
      sectionEl.appendChild(cardEl);
    });
    root.appendChild(sectionEl);
  }
  const meta = document.getElementById('search-meta');
  const noResults = document.getElementById('no-results');
  if (total === 0) {
    noResults.classList.add('visible');
    meta.textContent = q ? `No matches for "${q}".` : 'No matches.';
  } else {
    noResults.classList.remove('visible');
    if (q || sec !== 'all') {
      const secName = sec === 'all' ? 'across all 5 sections' : `in ${SECTIONS[sec].title}`;
      meta.textContent = `${total} ${total === 1 ? 'situation' : 'situations'} ${q ? `matching "${q}" ` : ''}${secName}.`;
    } else {
      meta.textContent = `45 situations across 5 sections.`;
    }
  }
}

// === EVENTS ===
document.getElementById('search').addEventListener('input', e => {
  state.query = e.target.value;
  document.getElementById('clear-btn').classList.toggle('visible', state.query.length > 0);
  render();
});
function clearSearch() {
  state.query = '';
  document.getElementById('search').value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  render();
  document.getElementById('search').focus();
}
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  state.section = chip.dataset.section;
  render();
});

render();
</script>
